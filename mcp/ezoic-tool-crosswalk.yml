rest_only:
- operations: [getReports, getReport, getCustomReports, createCustomReport, getColumns]
  reason: Report definition management. The Analytics MCP is read-only over data and exposes no report CRUD.
- operations: [getSegments, createSegment, getMultiFilters, getMultiFilterTypes]
  reason: Segment and filter construction. The MCP applies breakdowns conversationally rather than exposing segment CRUD.
- operations: [checkAccess, listProducts, listPurchases]
  reason: Ezoic Subscriptions entitlement reads. No MCP surface covers subscriptions.
- operations: [cdnPing, clearCache, bulkClearCache, clearBySurrogateKeys, purgeCache]
  reason: CDN cache invalidation is a write surface; no MCP server exposes it.

coverage:
