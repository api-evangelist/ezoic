source: >-
  mcp/ezoic-mcp.yml , mcp/ezoic-setup-mcp-tools.json ,
  openapi/ezoic-big-data-analytics-api-openapi.yml ,
  openapi/ezoic-access-api-openapi.yml , openapi/ezoic-products-api-openapi.yml ,
  openapi/ezoic-purchases-api-openapi.yml , openapi/ezoic-cdn-api-openapi.yml
note: >-
  Ezoic's Analytics MCP and its Big Data Analytics REST API are two front doors onto the
  same warehouse — Ezoic says so itself ("the same data that powers Big Data Analytics in
  your Ezoic account"). Every analytics tool therefore binds to the BDA data operations.
  The binding is by semantics, not by an observed schema: the Analytics tools/list is
  OAuth-gated (401), so confidence is set accordingly and no inputSchema is claimed for
  those tools. The Setup Assistant's tools ARE live-introspected, and they bind to
  nothing in REST — that server is a retrieval agent over documentation, not a wrapper.

surfaces:
  openapi:
  - file: openapi/ezoic-big-data-analytics-api-openapi.yml
    base: https://api-gateway.ezoic.com
    gated: false
    note: Spec is public documentation; calling it needs an account developerKey.
  - file: openapi/ezoic-cdn-api-openapi.yml
    base: https://api-gateway.ezoic.com
    gated: false
  - files:
    - openapi/ezoic-access-api-openapi.yml
    - openapi/ezoic-products-api-openapi.yml
    - openapi/ezoic-purchases-api-openapi.yml
    base: https://api-gateway.ezoic.com/subscriptions/v1
    gated: false
  mcp:
  - url: https://analytics-mcp.ezoic.com/mcp
    gated: true
    gate: OAuth 2.0 (RFC 9728 protected resource, AS https://token.ezoic.com)
  - url: https://setup-agent.ezoic.com/mcp
    gated: false
    gate: none — anonymous
  graphql: none published

