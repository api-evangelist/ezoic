generated: '2026-08-13'
method: probed
source: live probes of /.well-known/* on every Ezoic host named in apis.yml and in the OpenAPI servers[]
note: >-
  Round 2 found real documents that round 1 missed, because they are not on the marketing
  or docs host: Ezoic serves RFC 9728 OAuth protected-resource metadata from its MCP host
  (analytics-mcp.ezoic.com) and a full RFC 8414 authorization-server metadata document
  plus a JWKS from its dedicated token host (token.ezoic.com). Those are real, parsing
  JSON documents, so a WellKnown pointer is wired. Everything on www.ezoic.com and
  docs.ezoic.com still 404s — including security.txt, so no SecurityTxt pointer is wired
  even though Ezoic does run a disclosure program at https://www.ezoic.com/security.
hosts:
- host: https://token.ezoic.com
  role: OAuth 2.0 authorization server for Ezoic MCP / agent access
  documents:
  - path: /.well-known/oauth-authorization-server
    status: 200
    content_type: application/json
    file: ezoic-oauth-authorization-server.json
    spec: RFC 8414
  - path: /.well-known/jwks.json
    status: 200
    content_type: application/json
    file: ezoic-jwks.json
    spec: RFC 7517
  - path: /.well-known/openid-configuration
    status: 404
- host: https://analytics-mcp.ezoic.com
  role: Ezoic Analytics MCP server (OAuth-protected resource)
  documents:
  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    file: ezoic-oauth-protected-resource.json
    spec: RFC 9728
    note: >-
      Also advertised at runtime — an unauthenticated POST to /mcp returns 401 with
      WWW-Authenticate Bearer resource_metadata="https://analytics-mcp.ezoic.com/.well-known/oauth-protected-resource".
  - path: /.well-known/oauth-protected-resource/mcp
    status: 404
  - path: /.well-known/oauth-authorization-server
    status: 404
  - path: /.well-known/security.txt
    status: 404
  - path: /.well-known/agent-card.json
    status: 404
- host: https://setup-agent.ezoic.com
  role: Ezoic Setup Assistant MCP server (anonymous, no auth)
  documents:
  - path: /.well-known/oauth-protected-resource
    status: 404
    note: Expected — this server requires no authentication.
  - path: /.well-known/agent-card.json
    status: 404
  - path: /.well-known/agent.json
    status: 404
- host: https://token.bidsystem.ai
  role: OAuth 2.0 authorization server for bidsystem.ai (Ezoic's advertiser platform)
  ownership: >-
    Different domain, same company — bidsystem.ai's homepage says "bidsystem.ai is Ezoic's
    performance advertising platform", ezoic.com's "Get Started" CTA links to
    https://admin.bidsystem.ai/register, and token.ezoic.com advertises the vendor grant
    urn:bidsystem:params:oauth:grant-type:adcp-client-recovery.
  documents:
  - path: /.well-known/oauth-authorization-server
    status: 200
    content_type: application/json
    file: ezoic-bidsystem-oauth-authorization-server.json
    spec: RFC 8414
    note: Byte-for-byte the same configuration as token.ezoic.com, with the issuer/endpoints swapped.
- host: https://api.bidsystem.ai
  role: bidsystem.ai MCP server (OAuth-protected resource)
  documents:
  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    file: ezoic-bidsystem-oauth-protected-resource.json
    spec: RFC 9728
    note: >-
      Publishes scopes_supported [openid, profile] — the only Ezoic-family resource that
      names any scope.
  - path: /.well-known/agent-card.json
    status: 404
    note: Proper JSON 404 ({"error":"not_found"}).
  - path: /.well-known/adcp.json
    status: 404
- host: https://www.bidsystem.ai
  documents:
