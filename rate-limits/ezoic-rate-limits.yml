summary: >-
  Ezoic publishes no rate limits for any of its APIs. Every page of the API section, the
  Subscriptions REST API reference and the Analytics MCP overview was read: none names a
  request ceiling, a window, a burst allowance, a 429, a Retry-After, or any
  X-RateLimit-*/RateLimit-* response header. The only volume controls Ezoic documents are
  request-shaped, not policy-shaped — pagination on Big Data Analytics and a batch size on
  the CDN bulk endpoint — and those are recorded below so a consumer can at least size
  their calls.
