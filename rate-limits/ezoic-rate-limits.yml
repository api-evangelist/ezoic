volume_controls_documented:
- api: Big Data Analytics
  control: pagination
  detail: >-
    getdata requires a MaxItems value; some reports (for example when using URL as a
    dimension) return thousands of rows, so callers paginate by incrementing StartItem.
    getCustomData accepts the same pair, and omitting both (or setting both to 0) returns
    all rows.
  source: https://docs.ezoic.com/docs/api/bdaservices/
- api: CDN
  control: batch size
  detail: bulkclearcache clears an array of URLs in batches of 100.
  source: https://docs.ezoic.com/docs/api/cdn/
- api: Subscriptions
  control: no caching
  detail: >-
    Reads are served with Cache-Control:no-store and Ezoic explicitly tells callers to
    call per decision rather than cache — a documented instruction to raise call volume,
    with no published ceiling to raise it against.
  source: https://docs.ezoic.com/docs/subscriptions/rest-api/
access_gate:
  note: >-
    In place of a rate limit, Ezoic gates by entitlement: each API-gateway service is off
    until enabled under Settings -> API Access, the developerKey is validated per service,
    and the gateway rejects any domain that does not belong to the key's account before
    the request reaches the service.
  source: https://docs.ezoic.com/docs/api/
