mcp_distribution:
  note: >-
    Both Ezoic MCP servers are REMOTE endpoints, not installable packages — there is no
    npm/PyPI MCP package to record. The two GitHub repos below are install/config shells
    (README + mcp.json + Cursor plugin metadata) around a hosted server.
  repos:
  - https://github.com/ezoic/bda-mcp-public
  - https://github.com/ezoic/ezoic-setup-mcp
  see_also: mcp/ezoic-mcp.yml
server_side_sdks:
  note: >-
    Ezoic publishes NO server-side client libraries for its REST APIs. Big Data Analytics,
    CDN and Subscriptions are all documented with raw curl/Python/PHP request examples
    rather than a wrapped SDK, in any language.
  count: 0
