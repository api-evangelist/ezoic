summary: >-
  Ezoic publishes no prices. Its /pricing page is a services-tier page, not a price list:
  tiers are assigned by the publisher's average monthly users, there is a hard 250,000
  monthly-user eligibility floor to work with Ezoic at all, and there is no self-serve
  paid plan, no per-call API price, and no free developer tier. Monetization is a revenue
  relationship with the publisher, so the API surface (Big Data Analytics, CDN,
  Subscriptions, Analytics MCP) carries no separate price — it is included with the
  account and each service is switched on from Settings -> API Access.
