authentication:
  style: api-key-query
  detail: >-
    Site credentials passed as query parameters (developerKey = Ezoic API key,
    domain = the account-owned domain). Reader identity passed as exactly one header:
    X-Ezoic-Reader-Email or X-Ezoic-Reader-Token (a session JWT). Reader identity must
    never be sent in the query string.
  see_also: authentication/ezoic-authentication.yml
