aid: ezoic
name: ezoic
description: >-
  Ezoic is a website monetization and audience-growth platform for publishers, and a
  performance advertising marketplace for brands. Publishers integrate EzoicAds (via
  JavaScript, mobile SDKs for Android/iOS/Flutter/React Native/Unity, or framework SDKs
  for Angular/React/Vue) to run native, sticky, video, anchor, rewarded, and interstitial
  ad formats across 5,000+ premium sites. Beyond ads, Ezoic offers first-party Identity
  (ezID), Visitor Accounts (ezAuth), Ezoic Subscriptions (paywalls, donations, and a
  server-to-server REST API for verifying reader access), a Web Games ad SDK, and Custom
  Events into its Big Data Analytics platform. Its developer surface is a single API
  gateway (api-gateway.ezoic.com) fronting three services enabled individually from the
  dashboard and sharing one developerKey — Big Data Analytics for reports, segments and
  custom data; CDN for cache clearing and purging; and Subscriptions for server-side
  reader entitlement checks. Ezoic also runs three hosted MCP servers: a read-only
  Analytics server over OAuth, an anonymous Setup Assistant listed in the official MCP
  Registry as com.ezoic/setup, and an OAuth-gated endpoint on bidsystem.ai, its
  performance advertising platform for brands.
