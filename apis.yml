aid: ezoic
name: ezoic
description: >-
  Ezoic is a website monetization and audience-growth platform for publishers, and a
  performance advertising marketplace for brands. Publishers integrate EzoicAds (via
  JavaScript, mobile SDKs for Android/iOS/Flutter/React Native/Unity, or framework SDKs
  for Angular/React/Vue) to run native, sticky, video, anchor, rewarded, and interstitial
  ad formats across 5,000+ premium sites. Beyond ads, Ezoic offers first-party Identity
  (ezID), Visitor Accounts (ezAuth), Ezoic Subscriptions (paywalls, donations, and a
  server-to-server REST API for verifying reader access), a Web Games ad SDK, Custom
  Events into its Big Data Analytics platform, and an official hosted Analytics MCP server
  that exposes read-only pageview, ad-impression, rewarded, and video analytics to AI
  assistants over OAuth.
