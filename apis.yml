- aid: ezoic:ezoic-big-data-analytics-api
  name: ezoic Big Data Analytics API
  description: >-
    The Big Data Analytics (BDA) REST API pulls the same reports and analytics data a
    publisher sees in the Ezoic dashboard — predefined reports that ship with the account
    and custom reports the publisher builds. 11 operations covering report definitions,
    report data, ad-hoc custom data, segments, and the multifilters that build them.
    Enabled per-service from Settings → API Access and authenticated with the shared
    Ezoic API-gateway developerKey.
  humanURL: https://docs.ezoic.com/docs/api/bdaservices/
