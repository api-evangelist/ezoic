- aid: ezoic:ezoic-cdn-api
  name: ezoic CDN API
  description: >-
    The CDN REST API clears and purges cached content on the Ezoic CDN — a single URL, a
    batch of URLs in groups of 100, a comma-separated set of surrogate keys, or a whole
    domain — plus a ping liveness check. 5 operations under /cdnservices/, enabled from
    Settings → API Access and authenticated with the shared Ezoic API-gateway
    developerKey.
  humanURL: https://docs.ezoic.com/docs/api/cdn/
